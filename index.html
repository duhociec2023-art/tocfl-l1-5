<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mini-CAT 當代中文 L1–5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Serif+TC:wght@500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow exam column; header strip carries section + step counter; level meter is the one visual signature */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#18202b; --muted:#5a6575; --line:#d5dbe3;
  --accent:#2f4b8f; --accent-soft:#e4e9f5; --gold:#b7862b;
  --ok:#1f7a4d; --ok-soft:#e2f2e9; --bad:#b03a3a; --bad-soft:#f7e3e3;
  --f-ui:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-zh:"Noto Serif TC","PingFang TC","Microsoft JhengHei",serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161d; --surface:#1b212b; --ink:#e7ebf1; --muted:#9aa5b5; --line:#2e3644;
  --accent:#8fa8e6; --accent-soft:#25304a; --gold:#d9ad55;
  --ok:#5cc28f; --ok-soft:#173226; --bad:#e57b7b; --bad-soft:#3a1f22; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161d; --surface:#1b212b; --ink:#e7ebf1; --muted:#9aa5b5; --line:#2e3644;
  --accent:#8fa8e6; --accent-soft:#25304a; --gold:#d9ad55;
  --ok:#5cc28f; --ok-soft:#173226; --bad:#e57b7b; --bad-soft:#3a1f22; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6}
.wrap{max-width:680px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:16px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-weight:700;letter-spacing:.02em}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.step{font-family:var(--f-num);font-size:13px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
h1,h2{margin:0;text-wrap:balance;line-height:1.3}
h1{font-size:24px} h2{font-size:18px}
p{margin:0}
.muted{color:var(--muted)}
.label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lessons{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px 14px;font-size:14px}
.lessons span{font-family:var(--f-zh)}
.lessons b{font-family:var(--f-num);font-weight:500;color:var(--accent);margin-right:6px}
ul.rules{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
input[type=text]{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid transparent;padding:11px 18px;font-weight:600}
button:focus-visible,.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--surface)}
.primary:disabled{opacity:.4;cursor:not-allowed}
.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
/* level meter */
.meter{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted)}
.steps{display:flex;align-items:flex-end;gap:3px}
.steps i{display:block;width:14px;border-radius:2px;background:var(--line)}
.steps i:nth-child(1){height:8px}.steps i:nth-child(2){height:14px}.steps i:nth-child(3){height:20px}
.steps i.on{background:var(--gold)}
.zh{font-family:var(--f-zh);font-size:22px;line-height:1.75;letter-spacing:.02em}
.passage{font-family:var(--f-zh);font-size:19px;line-height:1.9;background:var(--bg);border-radius:8px;padding:14px 16px}
.q{font-family:var(--f-zh);font-size:19px;font-weight:700}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);color:var(--ink);font-family:var(--f-zh);font-size:18px;font-weight:500;padding:12px 14px}
.opt .k{font-family:var(--f-num);font-size:13px;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;flex:none;color:var(--muted)}
.opt[aria-pressed=true]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-pressed=true] .k{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.play{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.notice{font-size:13px;background:var(--bad-soft);color:var(--ink);border-radius:8px;padding:10px 12px}
.transcript{font-family:var(--f-zh);font-size:17px;line-height:1.8;border-left:3px solid var(--line);padding-left:12px}
/* results */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.big{font-family:var(--f-num);font-size:30px;font-weight:500;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
svg.trace{width:100%;height:auto;max-width:100%}
.trace .grid{stroke:var(--line);stroke-width:1}
.trace .path{fill:none;stroke:var(--accent);stroke-width:2}
.trace .dot-ok{fill:var(--ok)} .trace .dot-bad{fill:var(--surface);stroke:var(--bad);stroke-width:2}
.trace text{fill:var(--muted);font-family:var(--f-num);font-size:11px}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
td.zht{font-family:var(--f-zh)}
.barcell{display:flex;align-items:center;gap:8px}
.hbar{flex:1;height:6px;background:var(--line);border-radius:3px;min-width:60px;overflow:hidden}
.hbar span{display:block;height:100%;background:var(--accent)}
details{border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:600}
.rev{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.rev div{font-size:14px;padding:10px 12px;border-radius:8px;background:var(--bg)}
.rev .zhs{font-family:var(--f-zh);font-size:16px}
.tag-ok{color:var(--ok);font-weight:600}.tag-bad{color:var(--bad);font-weight:600}
@media (prefers-reduced-motion:no-preference){.card{animation:in .25s ease-out}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}
</style>
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>

{s:"R",les:3,lv:3,t:"明華喜歡游泳，也喜歡打籃球。他不喜歡看電影，覺得電影沒有意思。",q:"明華不喜歡什麼？",o:["看電影","游泳","打籃球"],k:0},
{s:"R",les:4,lv:3,t:"這家店的咖啡，小杯五十塊，大杯七十塊。我要買一杯大杯的和一杯小杯的。",q:"一共多少錢？",o:["一百二十塊","一百塊","一百四十塊"],k:0},
{s:"R",les:4,lv:3,t:"新手機兩萬塊，太貴了。舊手機九千塊，很便宜，可是不好看。",q:"哪一個對？",o:["新手機很貴","舊手機很好看","舊手機兩萬塊"],k:0},
{s:"R",les:5,lv:3,t:"這家餐廳的牛肉麵很有名，可是太辣了。我不喜歡吃辣的，我常吃他們的牛肉湯。",q:"他為什麼不常吃這家的牛肉麵？",o:["太辣了","太貴了","不有名"],k:0},
{s:"R",les:5,lv:3,t:"我和朋友去吃飯。我要一碗牛肉麵，朋友要兩碗。一碗一百五十塊。",q:"他們一共要給多少錢？",o:["四百五十塊","三百塊","一百五十塊"],k:0},
].map((x,i)=>({...x,id:i}));

const app=document.getElementById("app"), stepEl=document.getElementById("step");
let S;
function reset(){S={name:"",sec:null,secs:{L:mk(),R:mk()},cur:null,choice:null,plays:0}}
function mk(){return{level:2,streak:0,used:new Set(),hist:[]}}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const meter=lv=>`<span class="steps" aria-hidden="true">${[1,2,3].map(n=>`<i class="${n<=lv?"on":""}"></i>`).join("")}</span>`;

/* ---------- speech ---------- */
const synth=window.speechSynthesis||null;let voice=null;
function pickVoice(){if(!synth)return;const v=synth.getVoices();
  voice=v.find(x=>/zh[-_]TW/i.test(x.lang))||v.find(x=>/zh[-_](HK|Hant)/i.test(x.lang))||v.find(x=>/^zh|cmn/i.test(x.lang))||null}
if(synth){pickVoice();synth.onvoiceschanged=pickVoice}
function speak(lines,done){if(!synth){done&&done();return}synth.cancel();
  lines.forEach(([sp,txt],i)=>{const u=new SpeechSynthesisUtterance(txt);
    u.lang=voice?voice.lang:"zh-TW";if(voice)u.voice=voice;u.rate=.85;
    u.pitch=sp==="女"?1.3:sp==="男"?.75:1;
    if(i===lines.length-1)u.onend=()=>done&&done();synth.speak(u)})}

/* ---------- screens ---------- */
function intro(){stepEl.textContent="";
app.innerHTML=`<section class="card">
  <span class="label">Phạm vi</span>
  <h1>Bài kiểm tra thích ứng 5 bài đầu 《當代中文課程》第一冊</h1>
  <div class="lessons">${Object.entries(LESSONS).map(([n,t])=>`<div><b>L${n}</b><span>${t}</span></div>`).join("")}</div>
  <span class="label">Cách làm</span>
  <ul class="rules">
    <li>Hai phần: <b>Nghe</b> (${PER_SECTION} câu) rồi <b>Đọc</b> (${PER_SECTION} câu).</li>
    <li>Đề tự đổi độ khó theo bạn: đúng 2 câu liền thì câu sau khó hơn, sai thì câu sau dễ hơn.</li>
    <li>Không quay lại câu trước được. Mỗi câu nghe được phát tối đa 2 lần.</li>
    <li>Phần Nghe cần bật loa hoặc đeo tai nghe.</li>
  </ul>
  <label class="label" for="nm">Họ tên học viên</label>
  <input type="text" id="nm" placeholder="Ví dụ: Nguyễn Văn An" autocomplete="name">
  <div class="row"><button class="primary" id="go">Bắt đầu phần Nghe</button></div>
</section>`;
document.getElementById("go").onclick=()=>{S.name=document.getElementById("nm").value.trim();startSec("L")}}

function startSec(sec){S.sec=sec;next()}

function pick(sec){const st=S.secs[sec];
  const cnt={};st.hist.forEach(h=>cnt[h.item.les]=(cnt[h.item.les]||0)+1);
  for(const lv of [st.level,st.level-1,st.level+1,st.level-2,st.level+2]){
    let pool=BANK.filter(i=>i.s===sec&&i.lv===lv&&!st.used.has(i.id));
    if(!pool.length)continue;
    const min=Math.min(...pool.map(i=>cnt[i.les]||0));
    pool=pool.filter(i=>(cnt[i.les]||0)===min);
    return pool[Math.floor(Math.random()*pool.length)]}
  return null}

function next(){const st=S.secs[S.sec];
  if(st.hist.length>=PER_SECTION){S.sec==="L"?between():results();return}
  const item=pick(S.sec);if(!item){S.sec==="L"?between():results();return}
  st.used.add(item.id);S.cur={item,order:shuffle(item.o.map((t,i)=>({t,i})))};S.choice=null;S.plays=0;render()}

function render(){const st=S.secs[S.sec],it=S.cur.item,n=st.hist.length+1;
  stepEl.textContent=`${S.sec==="L"?"Nghe":"Đọc"} · câu ${n}/${PER_SECTION}`;
  const listen=S.sec==="L";
  app.innerHTML=`<section class="card">
   <div class="bar"><span class="label">${listen?"聽力 Nghe":"閱讀 Đọc"}</span>
     <span class="meter">${meter(st.level)} độ khó ${st.level}/3</span></div>
   ${listen?`<div class="play"><button class="ghost" id="pl">▶ Nghe (còn <span id="left">2</span> lần)</button>
      ${!synth||!voice?`<span class="notice">Thiết bị này chưa có giọng đọc tiếng Trung. Hãy thử Chrome hoặc Safari, hoặc nhờ giáo viên đọc. <button class="ghost" id="tr" style="padding:4px 10px;margin-left:4px">Hiện lời thoại</button></span>`:""}</div>
      <div class="transcript" id="tx" hidden>${it.a.map(([s,t])=>`${s?s+"：":""}${esc(t)}`).join("<br>")}</div>`
    :(it.t?`<div class="passage">${esc(it.t)}</div>`:"")}
   <p class="q">${esc(it.q)}</p>
   <div class="opts">${S.cur.order.map((o,j)=>`<button class="opt" data-i="${o.i}" aria-pressed="false"><span class="k">${"ABC"[j]}</span><span>${esc(o.t)}</span></button>`).join("")}</div>
   <div class="row"><button class="primary" id="nx" disabled>${n===PER_SECTION?"Hoàn thành phần này":"Câu tiếp theo"}</button></div>
  </section>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{S.choice=+b.dataset.i;
    app.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-pressed",x===b));document.getElementById("nx").disabled=false});
  document.getElementById("nx").onclick=answer;
  if(listen){const pl=document.getElementById("pl");
    pl.onclick=()=>{if(S.plays>=2)return;S.plays++;document.getElementById("left").textContent=2-S.plays;
      pl.disabled=true;speak(it.a,()=>{pl.disabled=S.plays>=2})};
    const tr=document.getElementById("tr");if(tr)tr.onclick=()=>{document.getElementById("tx").hidden=false;tr.remove()}}}

function answer(){if(synth)synth.cancel();
  const st=S.secs[S.sec],it=S.cur.item,ok=S.choice===it.k;
  st.hist.push({item:it,chosen:S.choice,ok,level:st.level});
  if(ok){st.streak++;if(st.streak>=2&&st.level<3){st.level++;st.streak=0}}
  else{st.streak=0;if(st.level>1)st.level--}
  next()}

function between(){stepEl.textContent="Hết phần Nghe";
  app.innerHTML=`<section class="card"><span class="label">Xong phần 1/2</span>
   <h2>Phần Nghe đã xong. Tiếp theo là phần Đọc.</h2>
   <p class="muted">Phần Đọc cũng có ${PER_SECTION} câu và bắt đầu lại ở độ khó 2.</p>
   <div class="row"><button class="primary" id="go">Bắt đầu phần Đọc</button></div></section>`;
  document.getElementById("go").onclick=()=>startSec("R")}

function trace(hist){const W=300,H=110,px=28,py=14,xs=(W-px-10)/(PER_SECTION-1),y=l=>py+(3-l)*((H-py*2-14)/2);
  const pts=hist.map((h,i)=>[px+i*xs,y(h.level)]);
  return `<svg class="trace" viewBox="0 0 ${W} ${H}" role="img" aria-label="Đường đi độ khó qua từng câu">
   ${[1,2,3].map(l=>`<line class="grid" x1="${px}" x2="${W-10}" y1="${y(l)}" y2="${y(l)}"/><text x="4" y="${y(l)+4}">${l}</text>`).join("")}
   <polyline class="path" points="${pts.map(p=>p.join(",")).join(" ")}"/>
   ${pts.map((p,i)=>`<circle class="${hist[i].ok?"dot-ok":"dot-bad"}" cx="${p[0]}" cy="${p[1]}" r="5"/>`).join("")}
   ${pts.map((p,i)=>`<text x="${p[0]-3}" y="${H-2}">${i+1}</text>`).join("")}</svg>`}

function results(){stepEl.textContent="Kết quả";
  const all=[...S.secs.L.hist,...S.secs.R.hist];
  const sec=k=>{const st=S.secs[k],c=st.hist.filter(h=>h.ok).length;
    return `<div class="card"><span class="label">${k==="L"?"聽力 Nghe":"閱讀 Đọc"}</span>
     <div class="row"><span class="big">${c}/${st.hist.length}</span><span class="pill">${LEVELS[st.level]}</span></div>
     ${trace(st.hist)}
     <p class="muted" style="font-size:13px">Chấm xanh: đúng · vòng đỏ: sai · trục dọc: độ khó của câu.</p></div>`};
  const rows=[1,2,3,4,5].map(l=>{const h=all.filter(x=>x.item.les===l),c=h.filter(x=>x.ok).length,p=h.length?Math.round(c/h.length*100):0;
    return `<tr><td><b>L${l}</b></td><td class="zht">${LESSONS[l]}</td><td>${c}/${h.length}</td>
      <td><div class="barcell"><div class="hbar"><span style="width:${p}%"></span></div>${h.length?p+"%":"–"}</div></td></tr>`}).join("");
  const rev=all.map((h,i)=>{const it=h.item;return `<div>
    <span class="${h.ok?"tag-ok":"tag-bad"}">${h.ok?"Đúng":"Sai"}</span> · ${it.s==="L"?"Nghe":"Đọc"} · L${it.les} · độ khó ${it.lv}
    <div class="zhs">${it.s==="L"?it.a.map(([s,t])=>(s?s+"：":"")+esc(t)).join(" "):esc(it.t)} <b>${esc(it.q)}</b></div>
    <div class="zhs">Đáp án: ${esc(it.o[it.k])}${h.ok?"":` · Đã chọn: ${esc(it.o[h.chosen])}`}</div></div>`}).join("");
  app.innerHTML=`<div style="display:flex;flex-direction:column;gap:16px">
   <section class="card"><span class="label">Kết quả</span>
    <h1>${S.name?esc(S.name):"Học viên"}</h1>
    <p class="muted">${new Date().toLocaleString("vi-VN")} · Chụp màn hình này gửi giáo viên.</p></section>
   <div class="stats">${sec("L")}${sec("R")}</div>
   <section class="card"><h2>Theo từng bài</h2>
    <div class="tbl"><table><thead><tr><th>Bài</th><th>Chủ đề</th><th>Đúng</th><th>Tỉ lệ</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="muted" style="font-size:13px">Số câu mỗi bài khác nhau vì đề tự chọn câu theo trình độ. Bài nào chỉ có 1–2 câu thì nên xem là tham khảo.</p>
    <details><summary>Xem lại từng câu</summary><div class="rev">${rev}</div></details></section>
   <div class="row"><button class="ghost" id="again">Làm lại từ đầu</button></div></div>`;
  document.getElementById("again").onclick=()=>{reset();intro()}}

reset();intro();
</script>

</body>
</html>
